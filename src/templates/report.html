<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessibility report</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;500&family=Atkinson+Hyperlegible+Next:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --sunken: #eef1f5;
      --ink: #142033;
      --ink-2: #4a5568;
      --line: #dce1e8;
      --mark: #c8133c;
      --serious: #b9480d;
      --moderate: #8a6100;
      --minor: #4b5d7a;
      --ok: #1f7a4d;
      --focus: #2f5bea;
      --shadow: 0 1px 2px rgba(20, 32, 51, 0.06), 0 8px 24px -12px rgba(20, 32, 51, 0.18);
      --sans: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: "Atkinson Hyperlegible Mono", ui-monospace, "SF Mono", Menlo, monospace;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0d1420;
        --surface: #151f2e;
        --sunken: #101928;
        --ink: #e8edf4;
        --ink-2: #a3b0c2;
        --line: #263246;
        --mark: #ff5c7c;
        --serious: #ff8b4f;
        --moderate: #f0c050;
        --minor: #9fb2d0;
        --ok: #4cc38a;
        --focus: #7ea0ff;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 12px 28px -14px rgba(0, 0, 0, 0.7);
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0d1420;
      --surface: #151f2e;
      --sunken: #101928;
      --ink: #e8edf4;
      --ink-2: #a3b0c2;
      --line: #263246;
      --mark: #ff5c7c;
      --serious: #ff8b4f;
      --moderate: #f0c050;
      --minor: #9fb2d0;
      --ok: #4cc38a;
      --focus: #7ea0ff;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 12px 28px -14px rgba(0, 0, 0, 0.7);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.5;
    }
    a { color: inherit; }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
    img { display: block; }
    .visually-hidden {
      position: absolute !important; width: 1px; height: 1px; margin: -1px; padding: 0;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    .wrap { max-width: 1240px; margin: 0 auto; padding: 0 24px; }

    /* ---------- Hero ---------- */
    .hero { padding: 40px 0 28px; }
    .hero-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .kicker { margin: 0; font-size: 15px; color: var(--ink-2); }
    .theme-toggle {
      border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
      padding: 6px 14px; font-size: 14px; cursor: pointer;
    }
    .domain {
      margin: 10px 0 0;
      font-size: clamp(40px, 7vw, 76px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.03em;
      overflow-wrap: anywhere;
    }
    .verdict {
      margin: 18px 0 0;
      max-width: 34ch;
      font-size: clamp(22px, 2.6vw, 30px);
      line-height: 1.25;
      font-weight: 500;
      letter-spacing: -0.01em;
    }
    .verdict strong { font-weight: 800; }
    .context { margin: 10px 0 0; color: var(--ink-2); font-size: 15px; max-width: 70ch; }

    .tally { display: flex; flex-wrap: wrap; gap: 10px; margin: 26px 0 0; padding: 0; list-style: none; }
    .tally button {
      display: flex; align-items: baseline; gap: 8px;
      border: 1.5px solid var(--line); background: var(--surface);
      border-radius: 12px; padding: 10px 16px 10px 14px; cursor: pointer;
      transition: border-color 120ms ease, opacity 120ms ease;
    }
    .tally button .n { font-size: 26px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
    .tally button .l { font-size: 15px; color: var(--ink-2); }
    .tally button[data-impact="critical"] .n { color: var(--mark); }
    .tally button[data-impact="serious"] .n { color: var(--serious); }
    .tally button[data-impact="moderate"] .n { color: var(--moderate); }
    .tally button[data-impact="minor"] .n { color: var(--minor); }
    .tally button[aria-pressed="true"][data-impact="critical"] { border-color: var(--mark); }
    .tally button[aria-pressed="true"][data-impact="serious"] { border-color: var(--serious); }
    .tally button[aria-pressed="true"][data-impact="moderate"] { border-color: var(--moderate); }
    .tally button[aria-pressed="true"][data-impact="minor"] { border-color: var(--minor); }
    .tally button[aria-pressed="false"] { opacity: 0.5; }
    .tally button[aria-pressed="false"] .n { text-decoration: line-through; text-decoration-thickness: 2px; }
    .tally-hint { margin: 8px 0 0; font-size: 14px; color: var(--ink-2); }

    /* ---------- Toolbar ---------- */
    .toolbar {
      position: sticky; top: 0; z-index: 5;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .toolbar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding-top: 12px; padding-bottom: 12px; }
    .seg { display: inline-flex; background: var(--sunken); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
    .seg button {
      border: 0; background: transparent; padding: 7px 14px; border-radius: 7px; cursor: pointer;
      font-size: 15px; color: var(--ink-2); white-space: nowrap;
    }
    .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: var(--shadow); }
    .search {
      flex: 1 1 220px; min-width: 0;
      border: 1px solid var(--line); background: var(--surface); color: var(--ink);
      border-radius: 10px; padding: 9px 14px; font: inherit; font-size: 15px;
    }
    .search::placeholder { color: var(--ink-2); }
    .sort {
      border: 1px solid var(--line); background: var(--surface); color: var(--ink);
      border-radius: 10px; padding: 9px 12px; font: inherit; font-size: 15px;
    }

    main { padding: 28px 0 64px; }
    .section-title { margin: 0 0 14px; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
    .section-title .count { color: var(--ink-2); font-weight: 500; }

    /* ---------- Page rows ---------- */
    .rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    .row {
      background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
      box-shadow: var(--shadow); overflow: hidden;
    }
    .row-main {
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr) minmax(0, 1.25fr);
      gap: 18px; align-items: center; padding: 14px 18px 14px 14px;
    }
    .thumb {
      width: 64px; aspect-ratio: 390 / 844; border-radius: 8px; overflow: hidden;
      border: 1px solid var(--line); background: var(--sunken); padding: 0; cursor: zoom-in;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
    .thumb.empty { cursor: default; display: grid; place-items: center; font-size: 11px; color: var(--ink-2); text-align: center; line-height: 1.2; }
    .toggle {
      display: grid; gap: 8px; text-align: left; border: 0; background: transparent;
      padding: 6px 4px; cursor: pointer; min-width: 0; border-radius: 8px;
    }
    .path { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; min-width: 0; }
    .path span { overflow-wrap: anywhere; }
    .chev { flex: none; width: 18px; height: 18px; transition: transform 160ms ease; color: var(--ink-2); }
    .row.open .chev { transform: rotate(90deg); }
    .url { font-size: 14px; color: var(--ink-2); overflow-wrap: anywhere; }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px;
      background: color-mix(in srgb, currentColor 11%, transparent);
    }
    .badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .badge.critical { color: var(--mark); }
    .badge.serious { color: var(--serious); }
    .badge.moderate { color: var(--moderate); }
    .badge.minor { color: var(--minor); }
    .badge.error { color: var(--mark); }
    .badge.error::before { display: none; }

    .strip {
      display: flex; gap: 10px; align-items: center; min-width: 0;
      overflow-x: auto; scrollbar-width: thin; padding: 2px 0 4px;
    }
    .tile {
      flex: none; height: 92px; max-width: 220px; padding: 0; cursor: zoom-in;
      border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff;
      position: relative;
    }
    .tile img { height: 100%; width: auto; max-width: 220px; object-fit: cover; object-position: center; }
    .tile .dev {
      position: absolute; left: 6px; bottom: 6px; font-size: 11px; font-weight: 700;
      background: rgba(20, 32, 51, 0.82); color: #fff; padding: 1px 7px; border-radius: 999px;
    }
    .more { flex: none; font-size: 14px; color: var(--ink-2); padding: 0 6px; white-space: nowrap; }
    .no-shots { font-size: 14px; color: var(--ink-2); }

    /* Expanded details */
    .details { border-top: 1px solid var(--line); background: var(--sunken); padding: 8px 18px 18px 96px; }
    .issue { padding: 18px 0; border-bottom: 1px solid var(--line); }
    .issue:last-child { border-bottom: 0; }
    .issue-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
    .issue-head h3 { margin: 0; font-size: 17px; font-weight: 700; flex: 1 1 280px; }
    .rule-id { font-family: var(--mono); font-size: 13px; color: var(--ink-2); }
    .learn { font-size: 14px; font-weight: 700; color: var(--focus); text-underline-offset: 3px; }
    .hint { margin: 10px 0 0; font-size: 15px; color: var(--ink-2); max-width: 78ch; }
    .hint ul { margin: 4px 0 0; padding-left: 20px; }
    .nodes { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; margin-top: 14px; }
    .node { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
    .node-shots { display: flex; gap: 1px; background: var(--line); }
    .node-shots .shot { flex: 1 1 0; min-width: 0; border: 0; padding: 0; background: #fff; cursor: zoom-in; position: relative; }
    .node-shots .shot img { width: 100%; height: 150px; object-fit: contain; background: #fff; }
    .node-shots .shot .dev { position: absolute; left: 8px; top: 8px; font-size: 11px; font-weight: 700; background: rgba(20, 32, 51, 0.82); color: #fff; padding: 1px 7px; border-radius: 999px; }
    .node pre {
      margin: 0; padding: 10px 12px; font-family: var(--mono); font-size: 12.5px; line-height: 1.55;
      white-space: pre-wrap; word-break: break-word; max-height: 8.5em; overflow: auto; color: var(--ink);
    }
    .node figcaption { padding: 0 12px 10px; font-size: 13px; color: var(--ink-2); }
    .nodes-more { margin: 10px 0 0; font-size: 14px; color: var(--ink-2); }

    /* ---------- Issues view ---------- */
    .rule { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 18px 20px; }
    .rule + .rule { margin-top: 12px; }
    .rule .issue-head h3 { font-size: 19px; }
    .rule-meta { margin: 6px 0 0; color: var(--ink-2); font-size: 15px; }
    .rule .strip { margin-top: 14px; overflow-x: auto; padding-bottom: 4px; }
    .rule .tile { height: 104px; }
    .rule .tile .cap {
      position: absolute; right: 0; bottom: 0; left: 0; padding: 14px 8px 5px; font-size: 11px; font-weight: 700;
      color: #fff; background: linear-gradient(transparent, rgba(20, 32, 51, 0.85)); text-align: left;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .rule-pages-toggle {
      margin-top: 12px; border: 1px solid var(--line); background: transparent; border-radius: 8px;
      padding: 6px 12px; font-size: 14px; cursor: pointer;
    }
    .rule-pages { list-style: none; margin: 12px 0 0; padding: 0; border-top: 1px solid var(--line); }
    .rule-pages li { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
    .rule-pages li:last-child { border-bottom: 0; }
    .rule-pages .rp-path { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .rule-pages .rp-count { color: var(--ink-2); font-size: 14px; white-space: nowrap; }
    .linkish { border: 0; background: none; padding: 0; color: var(--focus); font-weight: 700; font-size: 14px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

    /* ---------- Clean pages contact sheet ---------- */
    .clean { margin-top: 36px; }
    .clean-head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
    .clean-head .section-title { margin: 0; }
    .ok-mark { color: var(--ok); }
    .sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 18px 14px; margin-top: 18px; padding: 0; list-style: none; }
    .sheet li { min-width: 0; }
    .sheet .thumb { width: 100%; }
    .sheet a { display: block; margin-top: 6px; font-size: 13px; color: var(--ink-2); text-decoration: none; overflow-wrap: anywhere; line-height: 1.35; }
    .sheet a:hover { color: var(--ink); text-decoration: underline; }

    .empty-state { background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; padding: 28px; text-align: center; color: var(--ink-2); }
    .empty-state p { margin: 0 0 12px; }

    footer { border-top: 1px solid var(--line); padding: 22px 0 40px; color: var(--ink-2); font-size: 14px; }
    footer p { margin: 0; max-width: 78ch; }

    /* ---------- Lightbox ---------- */
    dialog.lightbox {
      border: 0; padding: 0; background: transparent; max-width: min(1200px, 94vw); max-height: 92vh; color: #fff;
    }
    dialog.lightbox::backdrop { background: rgba(8, 12, 20, 0.82); }
    .lb-inner { display: grid; gap: 10px; }
    .lb-img { max-width: 100%; max-height: calc(92vh - 70px); width: auto; height: auto; margin: 0 auto; border-radius: 8px; background: #fff; }
    .lb-bar { display: flex; align-items: center; gap: 14px; }
    .lb-cap { flex: 1; font-size: 15px; overflow-wrap: anywhere; }
    .lb-close { border: 1px solid rgba(255,255,255,0.4); background: transparent; color: #fff; border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 14px; }

    @media (max-width: 820px) {
      .toolbar { position: static; }
      .wrap { padding: 0 16px; }
      .hero { padding-top: 28px; }
      .row-main { grid-template-columns: 52px minmax(0, 1fr); gap: 12px; padding: 12px; }
      .thumb { width: 52px; }
      .row-main .strip { grid-column: 1 / -1; overflow-x: auto; padding-bottom: 2px; }
      .tile { height: 80px; }
      .details { padding: 4px 12px 14px; }
      .nodes { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <div class="hero-top">
        <p class="kicker">Accessibility report</p>
        <button class="theme-toggle" id="theme-toggle" type="button">Dark mode</button>
      </div>
      <h1 class="domain" id="domain"></h1>
      <p class="verdict" id="verdict"></p>
      <p class="context" id="context"></p>
      <ul class="tally" id="tally" aria-label="Problems by severity. Select to show or hide a severity."></ul>
      <p class="tally-hint">Select a severity to show or hide it.</p>
    </div>
  </header>

  <div class="toolbar">
    <div class="wrap">
      <div class="seg" role="group" aria-label="View">
        <button type="button" data-view="pages" aria-pressed="true">By page</button>
        <button type="button" data-view="issues" aria-pressed="false">By issue</button>
      </div>
      <label class="visually-hidden" for="search">Search pages</label>
      <input class="search" id="search" type="search" placeholder="Search pages" autocomplete="off">
      <div class="seg" role="group" aria-label="Screen size" id="device-seg"></div>
      <label class="visually-hidden" for="sort">Sort pages</label>
      <select class="sort" id="sort">
        <option value="severity">Most severe first</option>
        <option value="count">Most problems first</option>
        <option value="path">Page address, A to Z</option>
      </select>
    </div>
  </div>

  <main>
    <div class="wrap" id="view" aria-live="polite"></div>
  </main>

  <footer>
    <div class="wrap">
      <p>Made with accessible-web-scanner, using axe-core. Automated checks find roughly half of all accessibility problems. Test key pages with a keyboard and a screen reader too.</p>
    </div>
  </footer>

  <dialog class="lightbox" id="lightbox" aria-label="Screenshot">
    <div class="lb-inner">
      <img class="lb-img" id="lb-img" alt="">
      <div class="lb-bar">
        <p class="lb-cap" id="lb-cap"></p>
        <button class="lb-close" id="lb-close" type="button">Close</button>
      </div>
    </div>
  </dialog>

  <!-- DATA_PLACEHOLDER -->

  <script>
  (() => {
    const data = JSON.parse(document.getElementById('report-data').textContent);
    const results = data.results || [];

    const IMPACTS = ['critical', 'serious', 'moderate', 'minor'];
    const IMPACT_LABEL = { critical: 'Critical', serious: 'Serious', moderate: 'Moderate', minor: 'Minor' };
    const IMPACT_HELP = {
      critical: 'Blocks some people from using the page',
      serious: 'Makes the page very hard to use for some people',
      moderate: 'Gets in the way for some people',
      minor: 'A small annoyance',
    };
    const IMPACT_WEIGHT = { critical: 1000, serious: 100, moderate: 10, minor: 1 };
    const DEVICE_LABEL = { desktop: 'Desktop', mobile: 'Phone' };
    const STRIP_MAX = 5;
    const NODES_MAX = 6;

    const state = {
      view: 'pages',
      query: '',
      impacts: new Set(IMPACTS),
      device: 'all',
      sort: 'severity',
      showClean: false,
      open: new Set(),
      openRules: new Set(),
    };

    // ---------- helpers ----------
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const plural = (n, one, many) => `${n.toLocaleString()} ${n === 1 ? one : (many || one + 's')}`;
    const safeHref = (u) => (/^https?:\/\//i.test(u) ? esc(u) : '#');
    const pathOf = (u) => {
      try { const x = new URL(u); return (x.pathname + x.search) || '/'; } catch { return u; }
    };
    const hostOf = (u) => {
      try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return ''; }
    };
    const chevron = '<svg class="chev" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 4l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

    // Screenshots for an element, as [{device, src}]. Older reports used `screenshot`.
    function shotsOf(node) {
      if (node.screenshots) {
        return Object.keys(node.screenshots)
          .filter((d) => state.device === 'all' || d === state.device)
          .map((d) => ({ device: d, src: node.screenshots[d] }));
      }
      return node.screenshot ? [{ device: null, src: node.screenshot }] : [];
    }

    // Phone crops are narrower, so they stay legible as small tiles.
    const pickShot = (shots) => shots.find((x) => x.device === 'mobile') || shots[0];
    // The one device a problem is limited to, if any.
    const onlyOn = (node) => (node.devices && node.devices.length === 1 && (data.devices || []).length > 1 ? node.devices[0] : null);

    function nodeVisible(node) {
      if (state.device === 'all' || !node.devices) return true;
      return node.devices.includes(state.device);
    }

    // Violations for a page after severity + device filters.
    function visibleViolations(result) {
      return (result.violations || [])
        .filter((v) => state.impacts.has(v.impact))
        .map((v) => ({ ...v, nodes: v.nodes.filter(nodeVisible) }))
        .filter((v) => v.nodes.length > 0);
    }

    function counts(violations) {
      const c = { critical: 0, serious: 0, moderate: 0, minor: 0, total: 0 };
      for (const v of violations) { c[v.impact] += v.nodes.length; c.total += v.nodes.length; }
      return c;
    }

    const matchesQuery = (r) => !state.query || r.url.toLowerCase().includes(state.query);

    function formatHint(summary) {
      if (!summary) return '';
      const blocks = summary.split(/\n(?=Fix (?:any|all) of the following:)/);
      return blocks.map((block) => {
        const lines = block.split('\n').map((l) => l.trim()).filter(Boolean);
        let head = lines.shift() || '';
        head = head.replace('Fix any of the following:', 'Fix one of these:').replace('Fix all of the following:', 'Fix all of these:');
        if (!lines.length) return `<p class="hint">${esc(head)}</p>`;
        return `<div class="hint">${esc(head)}<ul>${lines.map((l) => `<li>${esc(l)}</li>`).join('')}</ul></div>`;
      }).join('');
    }

    function badges(c) {
      return IMPACTS.filter((i) => c[i] > 0)
        .map((i) => `<span class="badge ${i}">${c[i].toLocaleString()} ${IMPACT_LABEL[i].toLowerCase()}</span>`)
        .join('');
    }

    // Lightbox payload kept by id so captions don't have to live in attributes.
    const shotRegistry = [];
    function shotButton(cls, src, caption, inner) {
      const id = shotRegistry.push({ src, caption }) - 1;
      return `<button type="button" class="${cls}" data-shot="${id}" aria-label="Enlarge screenshot: ${esc(caption)}">${inner}</button>`;
    }

    // ---------- hero ----------
    function renderHero() {
      const hostCounts = {};
      for (const r of results) { const h = hostOf(r.url); if (h) hostCounts[h] = (hostCounts[h] || 0) + 1; }
      const host = Object.keys(hostCounts).sort((a, b) => hostCounts[b] - hostCounts[a])[0] || 'Your site';
      document.getElementById('domain').textContent = host;
      document.title = `Accessibility report for ${host}`;

      const scanned = results.length;
      const withProblems = results.filter((r) => r.success && r.violations.length > 0).length;
      const failed = results.filter((r) => !r.success).length;
      let verdict = withProblems === 0
        ? `No problems found on ${plural(scanned, 'page')}.`
        : `<strong>${withProblems.toLocaleString()}</strong> of ${plural(scanned, 'page')} ${withProblems === 1 ? 'has' : 'have'} problems to fix.`;
      if (failed) verdict += ` ${plural(failed, 'page')} couldn’t be scanned.`;
      document.getElementById('verdict').innerHTML = verdict;

      const devices = data.devices || [...new Set(results.flatMap((r) => r.devices || []))];
      const devText = devices.length === 2 ? 'desktop and phone' : devices.length === 1 ? (devices[0] === 'mobile' ? 'phone' : 'desktop') : '';
      const level = { a: 'WCAG 2.1 level A', aa: 'WCAG 2.2 level AA', aaa: 'WCAG level AAA' }[data.wcag] || 'WCAG';
      const when = new Date(data.generatedAt).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
      document.getElementById('context').textContent =
        `Checked ${devText ? `on ${devText} ` : ''}against ${level}, ${when}.`;

      document.getElementById('tally').innerHTML = IMPACTS.map((i) => `
        <li><button type="button" data-impact="${i}" aria-pressed="true" title="${esc(IMPACT_HELP[i])}">
          <span class="n">${(data.totals?.[i] || 0).toLocaleString()}</span><span class="l">${IMPACT_LABEL[i]}</span>
        </button></li>`).join('');

      const seg = document.getElementById('device-seg');
      if (devices.length > 1) {
        seg.innerHTML = [['all', 'All sizes'], ['desktop', 'Desktop'], ['mobile', 'Phone']]
          .map(([v, l]) => `<button type="button" data-device="${v}" aria-pressed="${v === 'all'}">${l}</button>`).join('');
      } else {
        seg.remove();
      }
    }

    // ---------- pages view ----------
    function rowStrip(violations) {
      const tiles = [];
      let total = 0;
      for (const v of violations) {
        for (const n of v.nodes) {
          const shots = shotsOf(n);
          total += 1;
          if (shots.length && tiles.length < STRIP_MAX) {
            const s = pickShot(shots);
            const only = onlyOn(n);
            const cap = `${v.help}${only ? ` (${DEVICE_LABEL[only].toLowerCase()} only)` : ''}`;
            tiles.push(shotButton('tile', s.src, cap,
              `<img src="${esc(s.src)}" alt="" loading="lazy">${only ? `<span class="dev">${DEVICE_LABEL[only]} only</span>` : ''}`));
          }
        }
      }
      if (!tiles.length) return `<div class="strip"><span class="no-shots">Not visible on screen, so no screenshot. Open the page details for the code.</span></div>`;
      const rest = total - tiles.length;
      return `<div class="strip">${tiles.join('')}${rest > 0 ? `<span class="more">+${rest.toLocaleString()} more</span>` : ''}</div>`;
    }

    function thumbHtml(r, big) {
      if (!r.thumbnail) return `<div class="thumb empty" aria-hidden="true">No preview</div>`;
      return shotButton('thumb', r.thumbnail, `${pathOf(r.url)}, top of page`, `<img src="${esc(r.thumbnail)}" alt="" loading="lazy">`);
    }

    function detailsHtml(r, violations) {
      return violations.map((v) => {
        const nodes = v.nodes.slice(0, NODES_MAX).map((n) => {
          const shots = shotsOf(n);
          const shotHtml = shots.length ? `<div class="node-shots">${shots.map((s) =>
            shotButton('shot', s.src, `${v.help} on ${pathOf(r.url)}${s.device ? ` (${DEVICE_LABEL[s.device]})` : ''}`,
              `<img src="${esc(s.src)}" alt="" loading="lazy">${s.device ? `<span class="dev">${DEVICE_LABEL[s.device]}</span>` : ''}`)).join('')}</div>` : '';
          const where = n.devices && n.devices.length ? `On ${n.devices.map((d) => DEVICE_LABEL[d].toLowerCase()).join(' and ')}` : '';
          return `<figure class="node">${shotHtml}<pre><code>${esc(n.html)}</code></pre>${where ? `<figcaption>${where}</figcaption>` : ''}</figure>`;
        }).join('');
        const more = v.nodes.length - NODES_MAX;
        return `<section class="issue">
          <div class="issue-head">
            <span class="badge ${v.impact}">${IMPACT_LABEL[v.impact]}</span>
            <h3>${esc(v.help)}</h3>
            <span class="rule-id">${esc(v.id)}</span>
            <a class="learn" href="${safeHref(v.helpUrl)}" target="_blank" rel="noopener">How to fix</a>
          </div>
          ${formatHint(v.nodes[0]?.failureSummary)}
          <div class="nodes">${nodes}</div>
          ${more > 0 ? `<p class="nodes-more">${plural(more, 'more place')} with this problem on this page.</p>` : ''}
        </section>`;
      }).join('');
    }

    function pageRow(r) {
      const idx = results.indexOf(r);
      const open = state.open.has(idx);
      if (!r.success) {
        return `<li class="row" id="page-${idx}"><div class="row-main">
          ${thumbHtml(r)}
          <div class="toggle" style="cursor:default"><span class="path"><span>${esc(pathOf(r.url))}</span></span>
            <a class="url" href="${safeHref(r.url)}" target="_blank" rel="noopener">${esc(r.url)}</a>
            <div class="badges"><span class="badge error">Couldn’t scan</span></div></div>
          <div class="strip"><span class="no-shots">${esc(r.error || 'Unknown error')}</span></div>
        </div></li>`;
      }
      const violations = visibleViolations(r);
      const c = counts(violations);
      return `<li class="row${open ? ' open' : ''}" id="page-${idx}">
        <div class="row-main">
          ${thumbHtml(r)}
          <button type="button" class="toggle" data-toggle="${idx}" aria-expanded="${open}" aria-controls="details-${idx}">
            <span class="path">${chevron}<span>${esc(pathOf(r.url))}</span></span>
            <span class="url">${esc(r.url)}</span>
            <span class="badges">${badges(c)}</span>
          </button>
          ${rowStrip(violations)}
        </div>
        <div class="details" id="details-${idx}" ${open ? '' : 'hidden'}>
          ${open ? detailsHtml(r, violations) : ''}
          <p class="nodes-more"><a class="learn" href="${safeHref(r.url)}" target="_blank" rel="noopener">Open this page</a></p>
        </div>
      </li>`;
    }

    function sortPages(list) {
      const score = (r) => { const c = counts(visibleViolations(r)); return IMPACTS.reduce((s, i) => s + c[i] * IMPACT_WEIGHT[i], 0); };
      if (state.sort === 'path') return list.sort((a, b) => pathOf(a.url).localeCompare(pathOf(b.url)));
      if (state.sort === 'count') return list.sort((a, b) => counts(visibleViolations(b)).total - counts(visibleViolations(a)).total || score(b) - score(a));
      return list.sort((a, b) => score(b) - score(a) || counts(visibleViolations(b)).total - counts(visibleViolations(a)).total);
    }

    function renderPages() {
      const problems = sortPages(results.filter((r) => r.success && matchesQuery(r) && visibleViolations(r).length > 0));
      const failed = results.filter((r) => !r.success && matchesQuery(r));
      const clean = results.filter((r) => r.success && r.violations.length === 0 && matchesQuery(r))
        .sort((a, b) => pathOf(a.url).localeCompare(pathOf(b.url)));

      let html = '';
      if (problems.length || failed.length) {
        html += `<h2 class="section-title">Pages with problems <span class="count">${problems.length.toLocaleString()}</span></h2>`;
        html += `<ol class="rows">${[...failed, ...problems].map(pageRow).join('')}</ol>`;
      } else if (state.query || state.impacts.size < 4 || state.device !== 'all') {
        html += `<div class="empty-state"><p>No pages with problems match these filters.</p><button type="button" class="linkish" data-clear>Clear filters</button></div>`;
      } else {
        html += `<div class="empty-state"><p>Every scanned page passed the automated checks.</p></div>`;
      }

      if (clean.length) {
        html += `<section class="clean">
          <div class="clean-head">
            <h2 class="section-title"><span class="ok-mark">${plural(clean.length, 'page')}</span> passed every check</h2>
            <button type="button" class="rule-pages-toggle" data-clean aria-expanded="${state.showClean}">${state.showClean ? 'Hide them' : 'Show them'}</button>
          </div>
          ${state.showClean ? `<ul class="sheet">${clean.map((r) => `<li>${thumbHtml(r)}<a href="${safeHref(r.url)}" target="_blank" rel="noopener">${esc(pathOf(r.url))}</a></li>`).join('')}</ul>` : ''}
        </section>`;
      }
      return html;
    }

    // ---------- issues view ----------
    function renderIssues() {
      const rules = new Map();
      for (const r of results) {
        if (!r.success || !matchesQuery(r)) continue;
        for (const v of visibleViolations(r)) {
          let rule = rules.get(v.id);
          if (!rule) { rule = { id: v.id, impact: v.impact, help: v.help, helpUrl: v.helpUrl, pages: [], count: 0 }; rules.set(v.id, rule); }
          rule.pages.push({ r, v });
          rule.count += v.nodes.length;
        }
      }
      const list = [...rules.values()].sort((a, b) =>
        IMPACT_WEIGHT[b.impact] - IMPACT_WEIGHT[a.impact] || b.pages.length - a.pages.length || b.count - a.count);

      if (!list.length) {
        return `<div class="empty-state"><p>No problems match these filters.</p>${state.query || state.impacts.size < 4 || state.device !== 'all' ? '<button type="button" class="linkish" data-clear>Clear filters</button>' : ''}</div>`;
      }

      return `<h2 class="section-title">Problems by type <span class="count">${list.length}</span></h2>` + list.map((rule) => {
        const open = state.openRules.has(rule.id);
        const tiles = [];
        for (const { r, v } of rule.pages) {
          if (tiles.length >= 8) break;
          const n = v.nodes.find((x) => shotsOf(x).length);
          if (!n) continue;
          const shots = shotsOf(n);
          const s = pickShot(shots);
          tiles.push(shotButton('tile', s.src, `${rule.help} on ${pathOf(r.url)}`,
            `<img src="${esc(s.src)}" alt="" loading="lazy"><span class="cap">${esc(pathOf(r.url))}</span>`));
        }
        return `<section class="rule">
          <div class="issue-head">
            <span class="badge ${rule.impact}">${IMPACT_LABEL[rule.impact]}</span>
            <h3>${esc(rule.help)}</h3>
            <span class="rule-id">${esc(rule.id)}</span>
            <a class="learn" href="${safeHref(rule.helpUrl)}" target="_blank" rel="noopener">How to fix</a>
          </div>
          <p class="rule-meta">Found in ${plural(rule.count, 'place')} on ${plural(rule.pages.length, 'page')}.</p>
          ${tiles.length ? `<div class="strip">${tiles.join('')}</div>` : ''}
          <button type="button" class="rule-pages-toggle" data-rule="${esc(rule.id)}" aria-expanded="${open}">${open ? 'Hide pages' : `Show ${plural(rule.pages.length, 'page')}`}</button>
          ${open ? `<ul class="rule-pages">${rule.pages.map(({ r, v }) => `
            <li><span class="rp-path">${esc(pathOf(r.url))}</span>
              <span class="rp-count">${plural(v.nodes.length, 'place')}</span>
              <button type="button" class="linkish" data-goto="${results.indexOf(r)}">See details</button></li>`).join('')}</ul>` : ''}
        </section>`;
      }).join('');
    }

    // ---------- render + events ----------
    const view = document.getElementById('view');
    function render() {
      shotRegistry.length = 0;
      view.innerHTML = state.view === 'pages' ? renderPages() : renderIssues();
      document.getElementById('sort').disabled = state.view !== 'pages';
    }

    document.querySelector('.toolbar .seg').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-view]');
      if (!b) return;
      state.view = b.dataset.view;
      document.querySelectorAll('[data-view]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      render();
    });

    document.getElementById('tally').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-impact]');
      if (!b) return;
      const i = b.dataset.impact;
      if (state.impacts.has(i)) state.impacts.delete(i); else state.impacts.add(i);
      b.setAttribute('aria-pressed', String(state.impacts.has(i)));
      render();
    });

    const deviceSeg = document.getElementById('device-seg');
    deviceSeg?.addEventListener('click', (e) => {
      const b = e.target.closest('button[data-device]');
      if (!b) return;
      state.device = b.dataset.device;
      deviceSeg.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      render();
    });

    let searchTimer;
    document.getElementById('search').addEventListener('input', (e) => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => { state.query = e.target.value.trim().toLowerCase(); render(); }, 120);
    });
    document.getElementById('sort').addEventListener('change', (e) => { state.sort = e.target.value; render(); });

    function clearFilters() {
      state.query = ''; state.device = 'all'; state.impacts = new Set(IMPACTS);
      document.getElementById('search').value = '';
      document.querySelectorAll('#tally button').forEach((x) => x.setAttribute('aria-pressed', 'true'));
      deviceSeg?.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.device === 'all')));
      render();
    }

    view.addEventListener('click', (e) => {
      const shot = e.target.closest('[data-shot]');
      if (shot) { openLightbox(shotRegistry[Number(shot.dataset.shot)]); return; }

      const toggle = e.target.closest('[data-toggle]');
      if (toggle) {
        const idx = Number(toggle.dataset.toggle);
        if (state.open.has(idx)) state.open.delete(idx); else state.open.add(idx);
        render();
        document.querySelector(`[data-toggle="${idx}"]`)?.focus();
        return;
      }
      if (e.target.closest('[data-clean]')) { state.showClean = !state.showClean; render(); document.querySelector('[data-clean]')?.focus(); return; }
      const ruleBtn = e.target.closest('[data-rule]');
      if (ruleBtn) {
        const id = ruleBtn.dataset.rule;
        if (state.openRules.has(id)) state.openRules.delete(id); else state.openRules.add(id);
        render();
        document.querySelector(`[data-rule="${CSS.escape(id)}"]`)?.focus();
        return;
      }
      const go = e.target.closest('[data-goto]');
      if (go) {
        const idx = Number(go.dataset.goto);
        state.view = 'pages'; state.open.add(idx);
        document.querySelectorAll('[data-view]').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.view === 'pages')));
        render();
        const row = document.getElementById(`page-${idx}`);
        row?.scrollIntoView({ block: 'start' });
        row?.querySelector('[data-toggle]')?.focus({ preventScroll: true });
        return;
      }
      if (e.target.closest('[data-clear]')) clearFilters();
    });

    // ---------- lightbox ----------
    const lb = document.getElementById('lightbox');
    let lbReturn = null;
    function openLightbox(item) {
      if (!item) return;
      lbReturn = document.activeElement;
      document.getElementById('lb-img').src = item.src;
      document.getElementById('lb-img').alt = item.caption;
      document.getElementById('lb-cap').textContent = item.caption;
      lb.showModal();
    }
    document.getElementById('lb-close').addEventListener('click', () => lb.close());
    lb.addEventListener('click', (e) => { if (e.target === lb) lb.close(); });
    lb.addEventListener('close', () => lbReturn?.focus());

    // ---------- theme ----------
    const root = document.documentElement;
    const themeBtn = document.getElementById('theme-toggle');
    const prefersDark = () => window.matchMedia('(prefers-color-scheme: dark)').matches;
    function currentTheme() { return root.dataset.theme || (prefersDark() ? 'dark' : 'light'); }
    function syncThemeLabel() { themeBtn.textContent = currentTheme() === 'dark' ? 'Light mode' : 'Dark mode'; }
    try { const saved = localStorage.getItem('a11y-report-theme'); if (saved) root.dataset.theme = saved; } catch {}
    syncThemeLabel();
    themeBtn.addEventListener('click', () => {
      root.dataset.theme = currentTheme() === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem('a11y-report-theme', root.dataset.theme); } catch {}
      syncThemeLabel();
    });

    renderHero();
    render();
  })();
  </script>
</body>
</html>
